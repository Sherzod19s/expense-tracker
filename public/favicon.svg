<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <!-- Three bars: increasing height, last one partially filled -->
  <!-- Bar 1: short -->
  <rect x="14" y="36" width="8" height="18" rx="2" fill="#3fb950"/>
  <!-- Bar 2: medium -->
  <rect x="28" y="24" width="8" height="30" rx="2" fill="#3fb950"/>
  <!-- Bar 3: tall outline (the "in progress" bar) -->
  <rect x="42" y="12" width="8" height="42" rx="2" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <!-- Bar 3: partial fill from bottom (~55% filled, showing "tracking in progress") -->
  <rect x="42" y="31" width="8" height="23" rx="2" fill="#3fb950"/>
</svg>
